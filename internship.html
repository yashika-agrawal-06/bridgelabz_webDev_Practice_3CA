<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f3f4f6, #e0f2fe);
        color: #1f2937;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #111827;
        font-size: 2rem;
    }

    form {
        max-width: 700px;
        margin: 0 auto;
        background: #ffffff;
        padding: 30px 25px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    label {
        display: inline-block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
    }

    input, select, button, textarea {
        font: inherit;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="password"],
    select,
    textarea {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 18px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #f9fafb;
        outline: none;
        transition: 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="date"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input[type="radio"] {
        accent-color: #2563eb;
        margin-right: 8px;
    }

    input[type="file"] {
        width: 100%;
        margin-bottom: 18px;
        padding: 10px;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
    }

    button {
        width: 100%;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: 0.2s ease;
    }

    button[type="submit"] {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
    }

    button[type="submit"]:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e40af);
    }

    button[type="reset"] {
        background: #e5e7eb;
        color: #111827;
    }

    button[type="reset"]:hover {
        background: #d1d5db;
    }

    br {
        display: none;
    }

    @media (max-width: 480px) {
        form {
            padding: 20px 15px;
        }

        h1 {
            font-size: 1.5rem;
        }
    }
</style>
</head>
<body>
    <h1>Internship Application Form</h1>
    <form>
        <label for="name">Enter your fullname : </label>
        <Input type="text", id="name", name="name" placeholder="xyz" required>
        <br>
        <label for="email"> enter your email address : </label>
        <input type="email" id="email" name="email" placeholder="xyz@gmail.com" required>
        <br>
        <label for="phone">enter your mobile no. : </label>
        <input type="tel" id="phone" name="phone" placeholder="0000000000">
        <br>
        <label for="dob">enter your DOB</label>
        <input type="date" id="dob" name="dob">
        <br>
        <label for="password">enter your password : </label>
        <input type="password" id="password" name="password">
        <br>
        <label for="gender">Choose your gender : </label>
        <input type="radio" id="male" name="gender">
        <label for="male">male</label>
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender">
        <label for="other">Other</label>
        <br>
        <label for="course">select your course: </label>
        <select name="branch" id="branch">
            <option value="cse" id="cse"> cse </option>
            <option value="it" id="it">it</option>
            <option value="ece" id="ece">ece</option>
            <option value="mech" id="mech">mech</option>
        </select>
        <br>
        <label for="preference"> internship preference </label>
        <input type="radio" name="pref" id="remote">
        <label for="remote">remote</label>
        <input type="radio" name="pref" id="onsite">
        <label for="onsite">onsite</label>
        <input type="radio" name="pref" id="hybrid">
        <label for="hybrid">hybrid</label>
        <br>
        <label for="resume">upload your resume here : </label>
        <input type="file" name="res" id="resume">
        <br>
        <label for="cover">Add your cover letter here : </label>
        <input type="textarea" id="cover" nname="cover">
        <br>
        <label for="submit"> click  here to submit your form </label>
        <button type="submit" id="submit">submit</button>
        <br>
        <label for="reset"> click here to reset your form </label>
        <button type="reset" id="reset">reset</button>
        <br>


    </form>
</body>
</html>
