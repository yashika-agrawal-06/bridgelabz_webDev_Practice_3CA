    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        .body{
            background-color:aliceblue;
        
        }
        .cards-container{
            max-width:800px;
            margin:0 auto;
            background-color:aliceblue;
            font-family:sans-serif;
            display:grid;
            grid-template-columns:repeat(3,5fr);
            justify-items:center;
            align-items:center;
            gap:50px;
            

        }
        .movie-card{
            width:200px;
            border:1px solid;
            border-color:#e5e7eb;
            background-color:white;
            border-radius:12px;
            overflow:hidden;
            flex-direction:column;
            
            transition:all 0.2s;
            animation:cardAnimation 0.6s ease;
        }
        .movie-image img{
            width:100%;
            height:auto;
            object-fit:cover;
            display:flex;
        }
        .movie-title{
            font-weight:600;

        }
        .movie-info{
            padding:8px;
        }
        .movie-detail{
            color:gray;
        }
        .movie-card:hover{
            box-shadow: 10px 10px 10px black;
            
            transform:translateY(5px);
        }
        .booking{

             display:flex;
            justify-content:right;
            text-align:right;
            
            
        }
        .booki{
            
          position:fixed; 
           background-color: rgb(3, 135, 71);
            
            padding:2px;
            border-radius:10px;
            width:250px;
            height:60px;
            margin:5px;
            color: rgb(249, 250, 249);
           
        }
        .booki:hover{
            background-color: rgb(3, 71, 135);
            transform:translateY(5px);

        }
        .book-now-btn{
            background-color:black;
            color:white;
            border-radius:8px;
            padding:8px 16px;
        }
        .book-now-btn:hover{
            transform:scaleY(1.15);
            background-color:rgb(217, 119, 234);
        }
        @keyframes cardAnimation{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
        .movie-card:nth-child(1){
            animation-delay:0.1s;
        }
        .movie-card:nth-child(2){
            animation-delay:0.2s;
        }
        .movie-card:nth-child(3){
            animation-delay:0.3s;
        }
        .movie-card:nth-child(4){
            animation-delay:0.4s;
        }
        .movie-card:nth-child(5){
            animation-delay:0.5s;
        }
        .movie-card:nth-child(6){
            animation-delay:0.6s;
        }
        .movie-card:nth-child(7){
            animation-delay:0.7s;
        }

    </style>
