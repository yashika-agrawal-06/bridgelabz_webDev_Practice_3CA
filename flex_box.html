<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box-container{
        background-color:blanchedalmond;
        display: flex;
        /* gap: 20px; */
        /*justify-content: space-between;*/
        justify-content: center;
        gap:30px;
        align-items: flex-start;
        height:600px;
    }
    .box{
        background-color: rgb(35, 120, 194);
        height: 200px;
        width:300px;
        display:flex;
        align-items:center;
        justify-content:center;
      
    }
    .lower-box{
        background-color: rgb(35, 120, 194);
        align-items:center;
        justify-content:center;
         height: 200px;
        width:300px;
        display:flex;
        align-self:flex-end;
       
        
    }
</style>
<body>
    <div class="box-container">
        <div class="box"><h1></h1><span>box-1</span></div>
        <div class="box"><h1>box-2</h1></div>
        <div class="lower-box"><h1>box-3</h1><span>box-3</span></div>
        <div class="lower-box"><h1>box-4</h1></div>
    </div>
</body>
</html>
