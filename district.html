<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>District Navigation Header</title>
  
  <!-- Google Font (Inter / Poppins for modern clean look) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #f7f7fc;
    }

    /* Header Container */
    .navbar {
      width: 100%;
      height: 72px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Left Section: Logo & Location */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      line-height: 1;
      cursor: pointer;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #000000;
    }

    .logo-subtext {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #4f4f4f;
      margin-top: 1px;
    }

    .location-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding-left: 12px;
    }

    .location-icon {
      width: 18px;
      height: 18px;
      color: #666;
    }

    .location-info {
      display: flex;
      flex-direction: column;
    }

    .location-title {
      font-size: 14px;
      font-weight: 700;
      color: #1c1c1c;
      line-height: 1.2;
    }

    .location-subtitle {
      font-size: 11px;
      color: #767676;
      line-height: 1.2;
    }

    /* Center Section: Navigation Links */
    .nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item {
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: #363636;
      padding: 8px 18px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      color: #000000;
    }

    /* Active Pill for 'For you' */
    .nav-item.active {
      background-color: #ede9fe;
      color: #5b21b6;
      font-weight: 600;
    }

    /* Right Section: Search & User Icons */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      padding: 4px;
      transition: color 0.2s;
    }

    .icon-btn:hover {
      color: #000;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      cursor: pointer;
    }

    .user-avatar svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <!-- Header / Navbar -->
  <header class="navbar">
    
    <!-- Left: Logo & Location -->
    <div class="nav-left">
      <div class="logo-container">
        <span class="logo-text">district</span>
        <span class="logo-subtext">BY ZOMATO</span>
      </div>

      <div class="location-container">
        <!-- Location Map Pin Icon -->
        <svg class="location-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <div class="location-info">
          <span class="location-title">Gurugram</span>
          <span class="location-subtitle">Haryana</span>
        </div>
      </div>
    </div>

    <!-- Center: Category Menu Links -->
    <nav class="nav-center">
      <a href="#" class="nav-item active">For you</a>
      <a href="#" class="nav-item">Dining</a>
      <a href="#" class="nav-item">Movies</a>
      <a href="#" class="nav-item">Events</a>
      <a href="#" class="nav-item">Comedy</a>
      <a href="#" class="nav-item">Stores</a>
      <a href="#" class="nav-item">Activities</a>
      <a href="#" class="nav-item">Play</a>
    </nav>

    <!-- Right: Search & Profile Icons -->
    <div class="nav-right">
      <!-- Search Icon -->
      <button class="icon-btn" aria-label="Search">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </button>

      <!-- User Profile Circle -->
      <div class="user-avatar" aria-label="User Profile">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
    </div>

  </header>

</body>
</html>
