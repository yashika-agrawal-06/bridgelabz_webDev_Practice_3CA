<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: rgb(35, 120, 194);
            height: 200px;
            width:200px;
            margin: 30px;
            position:relative;
        }
        #box-1{
            position: sticky;
            top: 0;
            background-color: coral;
            z-index: 1;
        }
        #box-2{
            position:relative;
            right: 0px;
        }
       
        #box-3{
            position: absolute;
            top: 50;
            
        }

        #box-4{
            position: fixed;
            bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div id="box-1" class="box">I am static</div>
        <div id="box-2" class="box">I am relative</div>
        <div id="box-3" class="box">I am absolute</div>
        <div id="box-4" class="box">I am fixed</div>
    </div>

</body>
</html>
